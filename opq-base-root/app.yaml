apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opq-base-root
  namespace: argocd
spec:
  project: opq-base-root
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  source:
    path: opq-base/tetris
    repoURL: >-
      https://github.com/mlkrtk/argocd-bootstrapping.git
    targetRevision: dev
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - PrunePropagationPolicy=foreground
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
