apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  generators:
    - merge:
        mergeKeys:
          - name
        generators:
          - clusters:
              selector:
                matchLabels:
                  cluster-addons: "true"
                  provider: "aws"
              values:
                helmchart_url: https://charts.external-secrets.io
                helmchart_version: 0.5.9
                helmchart_name: external-secrets
                common_app_values: |
                  createOperator: true
          - clusters:
              selector:
                matchLabels:
                  cluster-addons: "true"
                  env: "dev"
              values:
                helmchart_version: 0.8.1
          - clusters:
              selector:
                matchLabels:
                  cluster-addons: "true"
                  env: "qa"
              values:
                helmchart_version: 0.8.1
          - git:
              repoURL: https://github.com/mlkrtk/argocd-bootstrapping.git
              revision: dev
              files:
              - path: "addon-apps/external-secrets/cluster-config/*/config.yaml"             

  template:
    metadata:
      name: 'external-secrets-{{name}}'
      labels:
        appset: external-secrets
        env: '{{metadata.labels.env}}'
      annotations:
        helmchart_version: '{{values.helmchart_version}}'
        helmchart_name: '{{values.helmchart_name}}'
    spec:
      project: external-secrets
      source:
        repoURL: '{{values.helmchart_url}}'
        targetRevision: '{{values.helmchart_version}}' 
        chart: '{{values.helmchart_name}}'
        helm:
          values: |
              {{values.common_app_values}}
              {{values.cluster_app_values}}
      destination:
        name: '{{name}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - Validate=true
          - PrunePropagationPolicy=foreground
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
