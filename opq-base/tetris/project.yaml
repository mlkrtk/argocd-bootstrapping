apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: opq-tetris
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/mlkrtk/argocd-bootstrapping.git
  - https://github.com/mlkrtk/argocd-manifests.git
  destinations:
  - server: "*"
    namespace: "*"
  - server: https://kubernetes.default.svc
    namespace: argocd
  description: "Tetris application"
  clusterResourceWhitelist:
  - group: "*"
    kind: "*"
  roles:
