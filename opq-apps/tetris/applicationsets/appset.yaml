apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: opq-tetris
  namespace: argocd
spec:
  generators:
    - merge:
        mergeKeys:
          - name
        generators:
          - clusters:
              selector:
                matchLabels:
                  project/opq: "true"
              values:
                repoURL: https://github.com/mlkrtk/argocd-manifests.git
                targetRevision: develop
          - git:
              repoURL: https://github.com/mlkrtk/argocd-bootstrapping.git
              revision: dev
              files:
              - path: "opq-apps/tetris/cluster-config/*/config.yaml"             

  template:
    metadata:
      name: 'tetris-{{name}}'
      labels:
        appset: tetris
        env: '{{metadata.labels.env}}'
      annotations:
        repoURL: '{{values.repoURL}}'
        kustomize_path: '{{values.kustomize_path}}'
    spec:
      project: opq-tetris
      source:
        repoURL: '{{values.repoURL}}'
        targetRevision: '{{values.targetRevision}}'
        path: '{{values.kustomize_path}}'
      destination:
        name: '{{name}}'
        namespace: '{{values.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - Validate=true
          - PrunePropagationPolicy=foreground
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
